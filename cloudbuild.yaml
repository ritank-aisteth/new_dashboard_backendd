steps:
  # ============================================================
  # 1. Build FastAPI Docker image
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-backend:$COMMIT_SHA'
      - '.'

  # ============================================================
  # 2. Push Docker image to Artifact Registry
  # ============================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-backend:$COMMIT_SHA'

  # ============================================================
  # 3. Deploy FastAPI backend to Cloud Run
  # ============================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aisteth-backend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--no-invoker-iam-check'

# ============================================================
# Store built image in Artifact Registry
# ============================================================
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-backend:$COMMIT_SHA'

# ============================================================
# Cloud Build settings
# ============================================================
options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'