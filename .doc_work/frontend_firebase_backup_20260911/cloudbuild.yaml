steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-frontend:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-frontend:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aisteth-frontend'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyB57F6C230qQxnZwZ5WUqnx7-XMTdww_l4,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=aisteth-development.firebaseapp.com,NEXT_PUBLIC_FIREBASE_PROJECT_ID=aisteth-development,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=aisteth-development.firebasestorage.app,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=586282894333,NEXT_PUBLIC_FIREBASE_APP_ID=1:586282894333:web:785d3a353bec16db1ecf94,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-K3TDD06YH7,DASHBOARD_API_BASE_URL=https://aisteth-backend-586282894333.asia-south1.run.app'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/aisteth/aisteth-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
